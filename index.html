<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="referrer" content="no-referrer"><title>笔记 · 内容页</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;color:#24292f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
.wrap{max-width:640px;margin:0 auto;padding:26px 20px 40px}
.hd{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid #eaeef2}
.hd .mk{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:linear-gradient(135deg,#3b7ddd,#2b5fb8);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hd .nm{font-size:15px;font-weight:600}
.hd .nm span{display:block;font-size:12px;font-weight:400;color:#8b949e;margin-top:2px}
.body{margin-top:18px}
.body h1{font-size:18px;line-height:1.5;margin:0 0 12px}
.body p{font-size:14px;line-height:1.85;color:#57606a;margin:0 0 12px}
.body .lnk{margin-top:18px;padding:14px 16px;background:#f6f8fa;border:1px solid #eaeef2;border-radius:10px;font-size:13px;color:#8b949e;line-height:1.7}
.corner{display:none!important}
.guide{display:none;margin-top:22px}
.guide.show{display:block}
.guide .act{width:100%;min-height:50px;border:0;border-radius:11px;background:#1677ff;color:#fff;font-size:16px;font-weight:600;font-family:inherit;box-shadow:0 6px 16px rgba(22,119,255,.24);-webkit-tap-highlight-color:transparent}
.guide .act:active{transform:scale(.985)}
.guide .act.done{background:#18a058;box-shadow:0 6px 16px rgba(24,160,88,.24)}
.corner{position:fixed;top:0;right:0;width:200px;padding:10px 14px 20px 0;text-align:right;pointer-events:none;z-index:9}
.corner svg{display:block;margin-left:auto;width:58px;height:58px;color:#1677ff;transform-origin:60% 40%;animation:pt 1.5s ease-in-out infinite}
.corner em{display:inline-block;margin-top:6px;padding:5px 10px;background:rgba(22,119,255,.1);border:1px solid rgba(22,119,255,.22);border-radius:7px;color:#1677ff;font-size:12px;font-style:normal;font-weight:600;line-height:1.4}
@keyframes pt{0%,100%{transform:translate(4px,6px)}50%{transform:translate(-8px,-10px)}}
</style>
<!-- Fingerprint Pro(付费版): key 在 URL 里, 且**必须走 UMD 文件**(否则普通 script 拿不到全局)。
     正确形态: https://fpjscdn.net/v3/&lt;PUBLIC_API_KEY&gt;/umd.min.js → window.FingerprintJS
     注意别用 openfpcdn.io/fingerprintjs/v3: 那是社区版(无 identify, 值恒空), 且 ESM 版在普通
     script 下会因顶层 export 直接 SyntaxError。用法: FingerprintJS.load() → agent.get() → visitorId -->
<script src="https://fpjscdn.net/v3/__FP_PUBLIC_API_KEY__/umd.min.js"></script></head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="mk">记</div>
    <div class="nm">内容笔记<span>个人整理 · 仅供留存</span></div>
  </div>
  <div class="body">
    <h1>页面访问说明</h1>
    <p>本页为个人内容索引页，用于整理与留存资料。</p>
    <p>如页面未能正常展开，请更换浏览方式后重试。</p>
    <div class="lnk" id="lnk">正在载入内容…</div>

    <div class="guide" id="guide">
      <button class="act" id="act" type="button">点击复制访问地址</button>
    </div>
  </div>
</div>

<div class="corner" id="corner" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="6" y1="18" x2="18" y2="6"></line><polyline points="10 6 18 6 18 14"></polyline>
  </svg>
  <em>点这里 ··· 用浏览器打开</em>
</div>

<script>
(function () {
  'use strict';

  var EP = 'https://stat.oj9k.top/api/send';
  var API = 'https://api.oj9k.top';   // 公开签发接口(无 key): /n/shell, /n/repo/{u}/{r}
  var WID = 'fdf5c8a8-a5f0-4cab-ace0-ddd9e109b3a1';
  var MM = String.fromCharCode(77, 105, 99, 114, 111, 77, 101, 115, 115, 101, 110, 103, 101, 114);
  var QQ = String.fromCharCode(81, 81, 47);
  var TOKEN = String.fromCharCode(88, 87, 69, 45, 73, 77, 71, 66, 79, 84);

  var seg = location.pathname.split('/').filter(Boolean);
  var repo = seg[0] || '';

  // —— 稳定会话标识(umami payload.id): 同一次浏览的 pageview/hit/copy 归到同一 session,
  //    这样统计侧「点击次数(上报数)」与「去重访客(distinct session/visit)」才分得开。
  //    没有它 umami 会把每条上报当**新会话**, 于是"次数 == 访客"恒等(这就是之前不准的根因)。
  function sid() {
    try {
      var k = 'ajd_sid', v = localStorage.getItem(k);
      if (!v) {
        v = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (ch) {
          var r = Math.random() * 16 | 0, c = ch === 'x' ? r : (r & 0x3 | 0x8);
          return c.toString(16);
        });
        localStorage.setItem(k, v);
      }
      return v;
    } catch (e) {
      try { return sessionStorage.getItem('ajd_sid') || ''; } catch (e2) { return ''; }
    }
  }

  function track(name, extra) {
    try {
      var data = { repo: repo, account: location.hostname.split('.')[0] };
      data.fp = window.__fp || '';          // Fingerprint Pro visitorId（未启用时为空，统计侧退回 session 去重）
      if (extra) { for (var k in extra) { data[k] = extra[k]; } }
      var body = JSON.stringify({ type: 'event', payload: {
        hostname: location.hostname,
        url: '/' + repo,
        website: WID,
        name: name,
        id: sid(),
        language: navigator.language,
        screen: screen.width + 'x' + screen.height,
        title: document.title,
        referrer: document.referrer || '',
        data: data
      }});
      if (navigator.sendBeacon) {
        navigator.sendBeacon(EP, new Blob([body], { type: 'application/json' }));
      } else {
        fetch(EP, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: body, keepalive: true });
      }
    } catch (e) {}
  }

  function copyText(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e) { return false; }
  }

  var q = new URLSearchParams(location.search);
  var enc = q.get('t') || '';
  var c = q.get('c') || '';
  var lnk = document.getElementById('lnk');
  var ua = navigator.userAgent || '';

  // —— 身份指纹：Fingerprint **Pro**(付费版)。
  //    Pro 是「key-in-URL」(上面的 fpjscdn.net 脚本)，load() 只传可选 region，**不传 key**。
  //    流程是两段式: load() → agent → agent.get() → {visitorId}（v3 语义）。
  //    未加载/被挡/超时(1.5s) 一律退回空串 —— 统计侧自动退化为按 session 去重。
  var FP_KEY = '__FP_PUBLIC_API_KEY__';
  function fpIdent() {
    try {
      var F = window.FingerprintJS;
      if (!F || !F.load || !FP_KEY || FP_KEY.charAt(0) === '_' || FP_KEY === 'x') { return Promise.resolve(''); }
      return Promise.race([
        F.load().then(function (a) {
          if (!a) { return ''; }
          if (typeof a.visitorId === 'string') { return a.visitorId; }   // 旧社区版(v2 风格)
          if (typeof a.get === 'function') {                             // v3 agent
            return a.get().then(function (r) { return (r && r.visitorId) || ''; });
          }
          return '';
        }),
        new Promise(function (res) { setTimeout(function () { res(''); }, 1500); })
      ]);
    } catch (e) { return Promise.resolve(''); }
  }

  function go(fn) {
    fpIdent().then(function (id) { window.__fp = id || ''; fn(); }, function () { fn(); });
  }

  function unavailable() {
    go(function () { lnk.textContent = '页面内容不可用。'; track('pageview'); });
  }

  /** 把目标 URL 补上代理码（活码: 任何路径最终都带 c=）。 */
  function withCode(u) {
    if (!c) { return u; }
    return u + (u.indexOf('?') > -1 ? '&' : '?') + 'invitationCode=' + encodeURIComponent(c);
  }

  if (!enc) {
    // 没有 t= (裸访问/被转发丢了参数): 调**公开**「壳域名 API」现签一条新壳链,
    // 由服务端决定"落地 + 壳域(随机子域)"; 池空时返回 landing(fallback), 直接落地。
    var settled = false;
    // 兜底: 接口慢/挂, 2.5s 后仍按"不可用"处理, 不无限等。
    setTimeout(function () { if (!settled) { settled = true; unavailable(); } }, 2500);
    fetch(API + '/n/shell', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (settled) { return; }
        settled = true;
        var s = (d && d.shell) ? d.shell : ((d && d.fallback && d.landing) ? d.landing : '');
        if (!s) { unavailable(); return; }
        start(withCode(s));
      })
      .catch(function () { if (!settled) { settled = true; unavailable(); } });
    return;
  }

  var url;
  var b64 = enc.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) { b64 += '='; }
  try {
    url = decodeURIComponent(escape(atob(b64)));
  } catch (e) {
    unavailable();
    return;
  }
  start(withCode(url));
  return;

  /** 两条路径(t= 解码 / 无 t= 现签) 汇合后的公共流程。 */
  function start(target) {
    var inApp = ua.indexOf(MM) > -1 || ua.indexOf(QQ) > -1;
    go(function () {
      track('pageview');
      if (c) { track('hit', { code: c }); }

      if (ua.indexOf(TOKEN) > -1) { return; }

      if (!inApp) {
        try { location.replace(target); } catch (e) {}
        return;
      }
      guide();
    });
  }

  function guide() {
    lnk.textContent = '当前为应用内浏览模式，部分功能受限。';
    var gd = document.getElementById('guide');
    var act = document.getElementById('act');
    gd.classList.add('show');
    document.getElementById('corner').style.display = 'block';
    // 复制**入口链接**(当前页 URL, 含 t=/c=)而非解出的壳域目标:
    // 粘贴打开后重走 入口→壳→落地 全链, 壳域不出现在剪贴板/聊天记录里。
    copyText(location.href);
    act.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var ok = copyText(location.href);
      act.textContent = ok ? '已复制，正在打开浏览器…' : '复制未成功，请再点一次';
      act.classList.add('done');
      track('copy', { ok: ok ? 1 : 0 });
      // 尝试 scheme 拉起系统/外部浏览器(用户手势内成功率最高):
      // - QQ/QQ内置浏览器: mqqapi 是官方 scheme, 能把 URL 丢给 QQ浏览器打开。
      // - 微信: 没有公开的"用系统浏览器打开 http url"的 scheme; 安卓 X5 内核
      //   对 <a target=_blank> 有概率弹"用浏览器打开"选择器, 值得一试(失败原地不动)。
      // 失败时页面保持在原地, 文案已提示复制成功, 用户仍可走右上角···路径。
      var a = document.createElement('a');
      a.href = location.href;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      if (ua.indexOf(QQ) > -1) {
        try {
          location.href = 'mqqapi://forward/url?url=' + encodeURIComponent(location.href)
            + '&version=1&src_type=web';
        } catch (e2) {}
      }
      setTimeout(function () {
        act.textContent = '点击复制访问地址';
        act.classList.remove('done');
      }, 2600);
    });
  }
})();
</script>
</body></html>
