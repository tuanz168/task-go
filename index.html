<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer"><title>跳转中...</title></head>
<body><p id="t" style="font:14px/1.6 sans-serif;padding:24px;text-align:center;color:#666">正在打开…</p>
<script>
(function(){
  var p=new URLSearchParams(location.search), t=p.get('t')||'', c=p.get('c');
  // t=base64url(落地地址); c=可选邀请码透传
  if(!t){document.getElementById('t').textContent='链接无效';return;}
  try{
    var b=t.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4)b+='=';
    var url=decodeURIComponent(escape(atob(b)));
    if(c) url+=(url.indexOf('?')>-1?'&':'?')+'invitationCode='+encodeURIComponent(c);
    var u=url;
    // QQ/微信内: 引导浏览器; 其他环境直接跳
    var ua=navigator.userAgent||'';
    if(/MicroMessenger|QQ\//i.test(ua)){
      document.getElementById('t').innerHTML='请点击右上角 ··· 选择"在浏览器打开"';
      // 复制地址兜底
      var ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');}catch(e){}
      ta.remove();
    }else{location.replace(u);}
  }catch(e){document.getElementById('t').textContent='链接无效';}
})();
</script>
<script>
/* 自托管统计(Umami) —— 大站跳板层命中计数, 失败静默 */
(function () {
    var EP = "https://stat.oj9k.top/api/send", WID = "fdf5c8a8-a5f0-4cab-ace0-ddd9e109b3a1";
    function send(name, extra) {
        try {
            var seg = location.pathname.split("/").filter(Boolean);
            var data = { layer: "jump", repo: seg[0] || "", account: location.hostname.split(".")[0] };
            if (extra) for (var k in extra) data[k] = extra[k];
            var body = JSON.stringify({ type: "event", payload: {
                hostname: location.hostname,
                url: "/" + (seg[0] || ""),
                website: WID,
                name: name,
                language: navigator.language,
                screen: screen.width + "x" + screen.height,
                title: document.title,
                referrer: document.referrer || "",
                data: data
            }});
            if (navigator.sendBeacon) {
                navigator.sendBeacon(EP, new Blob([body], { type: "application/json" }));
            } else {
                fetch(EP, { method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true });
            }
        } catch (e) {}
    }
    send("pageview");
    var c = new URLSearchParams(location.search).get("c");
    if (c) send("跳板命中", { code: c });
})();
</script>
</body></html>
